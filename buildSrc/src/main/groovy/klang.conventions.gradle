import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm'

    // Use Dokka for generating javadoc
    id 'org.jetbrains.dokka'
    // Use Detekt for static code analysis
    id 'io.gitlab.arturbosch.detekt'
}

group = "cz.j_jzk.klang"
version = "1.0-rc2"

repositories {
    // Prever Maven local to use libraries' development builds
    mavenLocal()
    mavenCentral()
    maven {
        url = "https://j-jzk.cz/dl/maven"
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.kotlin
        }
   }
}

dependencies {
    // Use the Kotlin JUnit integration.
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit'

    detektPlugins 'io.gitlab.arturbosch.detekt:detekt-formatting:1.23.8'
}

// set compatibility of the generated bytecode (both the blocks are needed)
kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.fromTarget("17")
    }
}
java {
    toolchain {
        targetCompatibility = JavaLanguageVersion.of(17)
    }
}

detekt {
    config = files('../detekt.yml')
}
